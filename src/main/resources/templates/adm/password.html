<!DOCTYPE html>
<!-- 관리자 본인 비밀번호 변경 — /adm/password.
     구성 규칙·재사용 금지 판정은 서버(PasswordPolicy/PasswordService)가 유일 기준이며,
     이 화면은 규칙을 안내만 한다(클라이언트 검증은 보조). -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-adm/layout}">
<head>
    <title>비밀번호 변경</title>
</head>
<body>
<div layout:fragment="content">
    <header th:replace="~{adm/fragments/adm-ui :: pageHead('비밀번호 변경',
            '변경 후에는 자동으로 로그아웃되며, 새 비밀번호로 다시 로그인해야 합니다.')}"></header>

    <div th:if="${error}" role="alert" class="krds-alert krds-alert-danger"
         style="margin-bottom:16px">
        <span aria-hidden="true">✕</span><p th:text="${error}">오류</p>
    </div>

    <section class="ladm-panel" style="max-width:560px">
        <div class="ladm-panel-body">
            <form th:action="@{/adm/password}" method="post" class="ladm-form">
                <div class="ladm-field">
                    <label for="currentPassword" class="text-label-md">현재 비밀번호<span
                            class="ladm-req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
                    <input id="currentPassword" name="currentPassword" type="password"
                           class="krds-input" autocomplete="current-password" required autofocus/>
                </div>
                <div class="ladm-field">
                    <label for="newPassword" class="text-label-md">새 비밀번호<span
                            class="ladm-req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
                    <input id="newPassword" name="newPassword" type="password" class="krds-input"
                           autocomplete="new-password" required/>
                    <p class="ladm-hint text-body-xs">
                        영문·숫자·특수문자 중 2종류 조합 10자 이상, 또는 3종류 조합 8자 이상.
                        최근 사용한 비밀번호는 재사용할 수 없습니다.</p>
                </div>
                <div class="ladm-field">
                    <label for="confirmPassword" class="text-label-md">새 비밀번호 확인<span
                            class="ladm-req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
                    <input id="confirmPassword" name="confirmPassword" type="password"
                           class="krds-input" autocomplete="new-password" required/>
                </div>
                <div class="ladm-actions">
                    <button type="submit" class="krds-btn krds-btn-primary">변경</button>
                    <a th:href="@{/adm/index}" class="krds-btn krds-btn-secondary">취소</a>
                </div>
            </form>
        </div>
    </section>
</div>
</body>
</html>
