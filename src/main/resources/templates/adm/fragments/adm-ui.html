<!DOCTYPE html>
<!-- 관리자 화면 공통 조각 — 페이지 머리·검색줄·페이저·플래시·빈 상태·배지.
     12개 관리 화면이 같은 리듬을 갖도록 여기 한 곳만 고친다.
     표·버튼·배지·페이저·입력은 전역 KRDS 프리셋을 그대로 쓰고(.krds-*),
     .ladm-* 는 배치만 담당한다 (SG-krds §4~5). -->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 페이지 머리 — 제목 + 한 줄 설명. 등록 버튼은 목록 패널 머리(listbar)가 갖는다 -->
<header th:fragment="pageHead(title, desc)" class="ladm-page-head">
    <div>
        <h1 class="ladm-page-title text-heading-lg text-fg-strong" th:text="${title}">제목</h1>
        <p class="text-body-sm text-fg-subtle" th:if="${desc}" th:utext="${desc}">설명</p>
    </div>
</header>

<!-- 저장·삭제 결과 안내. 컨트롤러가 RedirectAttributes 로 flash 를 넘긴다 -->
<div th:fragment="flash" th:remove="tag">
    <div th:if="${flashOk}" role="status" class="krds-alert krds-alert-success"
         style="margin-bottom:16px">
        <span aria-hidden="true">✓</span><p th:text="${flashOk}">저장되었습니다.</p>
    </div>
    <div th:if="${flashError}" role="alert" class="krds-alert krds-alert-danger"
         style="margin-bottom:16px">
        <span aria-hidden="true">✕</span><p th:text="${flashError}">오류</p>
    </div>
</div>

<!-- 검색 + 등록 — 패널 머리에 얹는다 -->
<div th:fragment="listbar(listUrl)" class="ladm-panel-head ladm-listbar">
    <form th:action="@{${listUrl}}" method="get" class="ladm-search" role="search">
        <label class="sr-only" for="keyword">검색어</label>
        <input id="keyword" name="keyword" class="krds-input" th:value="${cond?.keyword}"
               placeholder="이름·코드 검색"/>
        <button type="submit" class="krds-btn krds-btn-secondary">검색</button>
    </form>
    <span class="grow"></span>
    <a th:href="@{${listUrl} + '/form'}" class="krds-btn krds-btn-primary">등록</a>
</div>

<!-- 페이저. 검색어를 유지한 채 페이지만 바꾼다 -->
<nav th:fragment="pager(listUrl)" th:if="${page != null and page.totalPages() > 1}"
     class="krds-pagination" style="margin-top:20px" aria-label="페이지 이동">
    <a th:if="${page.hasPrev()}" class="krds-page"
       th:href="@{${listUrl}(page=${page.page() - 1}, keyword=${cond?.keyword})}">이전</a>
    <a th:each="p : ${page.blockPages()}"
       th:href="@{${listUrl}(page=${p}, keyword=${cond?.keyword})}"
       th:text="${p}" class="krds-page"
       th:attr="aria-current=${p == page.page()} ? 'page' : null">1</a>
    <a th:if="${page.hasNext()}" class="krds-page"
       th:href="@{${listUrl}(page=${page.page() + 1}, keyword=${cond?.keyword})}">다음</a>
</nav>

<!--
  목록이 비었을 때 — 문구만 두지 않고 다음 행동(등록)까지 제시한다.

  ⚠ 조건은 <b>프래그먼트 안</b>에 둔다. 호출 지점에 th:if 와 th:replace 를 같이 걸면
  th:replace(우선순위 100)가 th:if(300)보다 먼저 실행돼 조건이 무시되고 안내가 항상 뜬다
  (P7 실측 — 자료가 있는데 "등록된 자료가 없습니다"가 보이던 원인).
-->
<tr th:fragment="empty(colspan, empty, newUrl)" th:if="${empty}">
    <td th:attr="colspan=${colspan}" class="ladm-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M3 9h18M8 4v16"/>
        </svg>
        <p class="text-body-md text-fg-subtle">등록된 자료가 없습니다.</p>
        <p class="text-body-sm text-fg-subtle" th:if="${newUrl}">
            <a th:href="@{${newUrl}}" class="krds-link">첫 항목을 등록해 보세요</a>
        </p>
    </td>
</tr>

<!-- 사용/중지 배지 — 색만으로 구분하지 않도록 문구를 함께 둔다(SG §5) -->
<span th:fragment="useBadge(useYn)" class="krds-badge"
      th:classappend="${useYn == 'Y'} ? 'ladm-badge-on' : 'ladm-badge-off'"
      th:text="${useYn == 'Y'} ? '사용' : '중지'">사용</span>

</body>
</html>
