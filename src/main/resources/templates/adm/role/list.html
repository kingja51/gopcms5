<!DOCTYPE html>
<!-- 역할 목록 — 계층(상위 역할)과 파급 범위(하위 수·부여 계정 수)를 함께 보여준다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-adm/layout}">
<head>
    <title>역할 관리</title>
</head>
<body>
<div layout:fragment="content">
    <header th:replace="~{adm/fragments/adm-ui :: pageHead('역할 관리',
            '상위 역할을 가지면 하위 역할의 권한을 자동으로 얻습니다. 계층을 바꾸면 저장 시 자동으로 다시 전개합니다.')}"></header>

    <div th:replace="~{adm/fragments/adm-ui :: flash}"></div>

    <section class="ladm-panel">
        <div class="ladm-panel-head ladm-listbar">
            <form th:action="@{/adm/role}" method="get" class="ladm-search" role="search">
                <label class="sr-only" for="keyword">검색어</label>
                <input id="keyword" name="keyword" class="krds-input" th:value="${cond?.keyword}"
                       placeholder="역할 코드·이름 검색"/>
                <button type="submit" class="krds-btn krds-btn-secondary">검색</button>
            </form>
            <span class="grow"></span>
            <!-- 콘솔에서 직접 손댔을 때를 위한 수동 재전개 -->
            <form th:action="@{/adm/role/rebuild}" method="post" style="margin:0">
                <button type="submit" class="krds-btn krds-btn-tertiary"
                        data-confirm="역할 계층을 다시 전개하고 계정 권한 스냅샷을 맞춥니다. 진행할까요?">계층 재전개</button>
            </form>
            <a th:href="@{/adm/role/form}" class="krds-btn krds-btn-primary">등록</a>
        </div>

        <div class="ladm-tablewrap">
            <table class="krds-table krds-table-zebra">
                <caption class="sr-only">역할 목록</caption>
                <thead>
                <tr>
                    <th scope="col">역할 코드</th>
                    <th scope="col">이름</th>
                    <th scope="col">상위 역할</th>
                    <th scope="col">설명</th>
                    <th scope="col" class="num">하위</th>
                    <th scope="col" class="num">부여 계정</th>
                    <th scope="col" class="num">정렬</th>
                    <th scope="col" class="center">사용</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${page.content()}">
                    <td><a th:href="@{/adm/role/form(roleId=${r.roleId})}" class="krds-link"
                           th:text="${r.roleCode}">ROLE_ADMIN</a></td>
                    <td th:text="${r.roleName}">최고 관리자</td>
                    <td class="text-fg-subtle" th:text="${r.parentRoleName} ?: '— (독립 루트)'">-</td>
                    <td class="text-fg-subtle" th:text="${r.description} ?: '-'">-</td>
                    <td class="num" th:text="${r.descendantCount}">0</td>
                    <td class="num" th:text="${r.adminCount}">0</td>
                    <td class="num" th:text="${r.sortOrder}">0</td>
                    <td class="center">
                        <span th:replace="~{adm/fragments/adm-ui :: useBadge(${r.useYn})}"></span>
                    </td>
                </tr>
                <tr th:replace="~{adm/fragments/adm-ui :: empty(8, ${page.content().isEmpty()}, '/adm/role/form')}"></tr>
                </tbody>
            </table>
        </div>
    </section>

    <nav th:replace="~{adm/fragments/adm-ui :: pager('/adm/role')}"></nav>
</div>
</body>
</html>
