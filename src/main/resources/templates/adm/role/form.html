<!DOCTYPE html>
<!-- 역할 등록·수정 — 저장하면 계층 재전개까지 함께 돈다(권한 스냅샷 정합). -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-adm/layout}">
<head>
    <title>역할 등록·수정</title>
</head>
<body>
<div layout:fragment="content">
    <header th:replace="~{adm/fragments/adm-ui :: pageHead('역할 등록·수정',
            '상위 역할을 지정하면 그 역할이 이 역할의 권한을 자동으로 갖게 됩니다.')}"></header>

    <div th:replace="~{adm/fragments/adm-ui :: flash}"></div>

    <section class="ladm-panel" style="max-width:760px">
        <div class="ladm-panel-body">
            <form th:action="@{/adm/role/save}" method="post" class="ladm-form">
                <input type="hidden" name="roleId" th:value="${role.roleId}"/>

                <div class="ladm-form-row">
                    <div class="ladm-field">
                        <label for="roleCode" class="text-label-md">역할 코드<span
                                class="ladm-req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
                        <input id="roleCode" name="roleCode" class="krds-input" required
                               th:value="${role.roleCode}" placeholder="ROLE_EDITOR"/>
                        <p class="ladm-hint text-body-xs">
                            <code>ROLE_</code> 로 시작하는 영문 대문자·숫자·밑줄.
                            뷰의 권한 검사(<code>hasRole</code>)가 이 값을 씁니다.</p>
                    </div>
                    <div class="ladm-field">
                        <label for="roleName" class="text-label-md">이름<span
                                class="ladm-req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
                        <input id="roleName" name="roleName" class="krds-input" required
                               th:value="${role.roleName}"/>
                    </div>
                </div>

                <div class="ladm-form-row">
                    <div class="ladm-field">
                        <label for="parentRoleId" class="text-label-md">상위 역할</label>
                        <select id="parentRoleId" name="parentRoleId" class="krds-select">
                            <option value="">없음 — 독립 루트(다른 역할에 상속되지 않음)</option>
                            <option th:each="r : ${roles}" th:value="${r.roleId}"
                                    th:if="${r.roleId != role.roleId}"
                                    th:selected="${r.roleId == role.parentRoleId}"
                                    th:text="${r.roleCode + ' — ' + r.roleName}">ROLE_ADMIN</option>
                        </select>
                        <p class="ladm-hint text-body-xs">
                            상위 역할을 가진 계정은 이 역할이 필요한 화면도 통과합니다.</p>
                    </div>
                    <div class="ladm-field">
                        <label for="sortOrder" class="text-label-md">정렬 순서</label>
                        <input id="sortOrder" name="sortOrder" type="number" class="krds-input"
                               th:value="${role.sortOrder}"/>
                    </div>
                </div>

                <div class="ladm-field">
                    <label for="description" class="text-label-md">설명</label>
                    <input id="description" name="description" class="krds-input"
                           th:value="${role.description}"/>
                </div>

                <div class="ladm-field">
                    <label for="useYn" class="text-label-md">상태</label>
                    <select id="useYn" name="useYn" class="krds-select">
                        <option value="Y" th:selected="${role.useYn == 'Y'}">사용</option>
                        <option value="N" th:selected="${role.useYn == 'N'}">중지</option>
                    </select>
                    <p class="ladm-hint text-body-xs">
                        중지하면 계층 전개에서 빠져 이 역할로 열리던 화면이 닫힙니다.</p>
                </div>

                <div class="ladm-actions">
                    <button type="submit" class="krds-btn krds-btn-primary">저장</button>
                    <a th:href="@{/adm/role}" class="krds-btn krds-btn-secondary">목록</a>
                    <span class="grow"></span>
                    <button type="submit" th:if="${role.roleId}"
                            th:formaction="@{/adm/role/delete}" formnovalidate
                            class="krds-btn krds-btn-point"
                            data-confirm="이 역할을 삭제할까요?">삭제</button>
                </div>
            </form>
        </div>
    </section>
</div>
</body>
</html>
