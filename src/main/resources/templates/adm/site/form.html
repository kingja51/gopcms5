<!DOCTYPE html>
<!-- 사이트 등록·수정 — 3축은 "선택 안 함"이 곧 폴백(템플릿 기본)이라 빈 옵션을 남겨 둔다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-adm/layout}">
<head>
    <title>사이트 등록·수정</title>
</head>
<body>
<div layout:fragment="content">
    <header th:replace="~{adm/fragments/adm-ui :: pageHead('사이트 등록·수정',
            '기본 정보와 3축(템플릿·테마·레이아웃)을 지정합니다.')}"></header>

    <div th:replace="~{adm/fragments/adm-ui :: flash}"></div>

    <section class="ladm-panel">
        <div class="ladm-panel-body">
        <form th:action="@{/adm/site/save}" method="post" class="ladm-form">
        <input type="hidden" name="siteId" th:value="${siteForm.siteId}"/>

        <div class="ladm-form-row">
            <div class="ladm-field">
                <label for="siteCode">사이트 코드<span class="ladm-req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
                <input id="siteCode" name="siteCode" class="krds-input" required
                       th:value="${siteForm.siteCode}" pattern="[a-z0-9-]{1,30}"/>
                <p class="ladm-hint">URL 첫 세그먼트가 됩니다 — <code>/{코드}/index</code>.
                    소문자·숫자·하이픈만. 등록 후 변경하면 기존 링크가 끊깁니다.</p>
            </div>
            <div class="ladm-field">
                <label for="siteName">사이트 이름<span class="ladm-req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
                <input id="siteName" name="siteName" class="krds-input" required
                       th:value="${siteForm.siteName}"/>
            </div>
        </div>

        <div class="ladm-form-row">
            <div class="ladm-field">
                <label for="templateId">템플릿 (시각 언어)</label>
                <select id="templateId" name="templateId" class="krds-select">
                    <option value="">선택 안 함 — 기본(krds)</option>
                    <option th:each="t : ${templates}" th:value="${t.templateId}"
                            th:selected="${t.templateId == siteForm.templateId}"
                            th:text="${t.templateCode + ' — ' + t.templateName}">code</option>
                </select>
            </div>
            <div class="ladm-field">
                <label for="themeId">테마 (색)</label>
                <select id="themeId" name="themeId" class="krds-select">
                    <option value="">선택 안 함 — 템플릿 기본 브랜드</option>
                    <option th:each="th : ${themes}" th:value="${th.themeId}"
                            th:selected="${th.themeId == siteForm.themeId}"
                            th:text="${th.templateCode + ' / ' + th.themeCode + ' — ' + th.themeName}">code</option>
                </select>
                <p class="ladm-hint">선택한 템플릿에 속한 테마만 저장됩니다(복합 FK).</p>
            </div>
        </div>

        <div class="ladm-form-row">
            <div class="ladm-field">
                <label for="layoutId">레이아웃 (구조)</label>
                <select id="layoutId" name="layoutId" class="krds-select">
                    <option value="">선택 안 함 — 템플릿 기본 레이아웃</option>
                    <option th:each="l : ${layouts}" th:value="${l.layoutId}"
                            th:selected="${l.layoutId == siteForm.layoutId}"
                            th:text="${l.layoutCode + ' — ' + l.layoutName}">code</option>
                </select>
            </div>
            <div class="ladm-field">
                <label for="parentSiteId">상위 사이트</label>
                <select id="parentSiteId" name="parentSiteId" class="krds-select">
                    <option value="">없음 (최상위)</option>
                    <option th:each="s : ${sites}" th:value="${s.siteId}"
                            th:selected="${s.siteId == siteForm.parentSiteId}"
                            th:text="${s.siteCode + ' — ' + s.siteName}">code</option>
                </select>
            </div>
        </div>

        <div class="ladm-form-row">
            <div class="ladm-field">
                <label for="domain">도메인</label>
                <input id="domain" name="domain" class="krds-input" th:value="${siteForm.domain}"
                       placeholder="ai.example.ac.kr"/>
                <p class="ladm-hint">canonical URL 은 언제나 경로 방식입니다 — 도메인은 판별 보조.</p>
            </div>
            <div class="ladm-field">
                <label for="defaultLang">기본 언어</label>
                <input id="defaultLang" name="defaultLang" class="krds-input"
                       th:value="${siteForm.defaultLang}" placeholder="ko"/>
            </div>
        </div>

        <div class="ladm-form-row">
            <div class="ladm-field">
                <label for="sortOrder">정렬 순서</label>
                <input id="sortOrder" name="sortOrder" type="number" class="krds-input"
                       th:value="${siteForm.sortOrder}"/>
            </div>
            <div class="ladm-field">
                <label for="useYn">상태</label>
                <select id="useYn" name="useYn" class="krds-select">
                    <option value="Y" th:selected="${siteForm.useYn == 'Y'}">사용</option>
                    <option value="N" th:selected="${siteForm.useYn == 'N'}">중지</option>
                </select>
            </div>
        </div>

        <div class="ladm-field">
            <label for="defaultYn">기본 사이트</label>
            <select id="defaultYn" name="defaultYn" class="krds-select">
                <option value="N" th:selected="${siteForm.defaultYn == 'N'}">아니오</option>
                <option value="Y" th:selected="${siteForm.defaultYn == 'Y'}">예 — 루트(/) 접속 시 이 사이트로</option>
            </select>
            <p class="ladm-hint">기본 사이트는 하나뿐입니다. 새로 지정하면 기존 기본은 자동 해제됩니다.</p>
        </div>

        <div class="ladm-field">
            <label for="description">설명</label>
            <input id="description" name="description" class="krds-input"
                   th:value="${siteForm.description}"/>
        </div>

        <div class="ladm-field">
            <label for="headMeta">head 삽입 조각</label>
            <textarea class="krds-textarea" id="headMeta" name="headMeta" th:text="${siteForm.headMeta}"></textarea>
            <p class="ladm-hint">사이트 &lt;head&gt; 에 그대로 출력됩니다(th:utext) — 신뢰할 수 있는 값만.</p>
        </div>

        <div class="ladm-field">
            <label for="copyright">푸터 저작권 표기</label>
            <textarea class="krds-textarea" id="copyright" name="copyright" th:text="${siteForm.copyright}"></textarea>
        </div>

        <div class="ladm-actions">
            <button type="submit" class="krds-btn krds-btn-primary">저장</button>
            <a th:href="@{/adm/site}" class="krds-btn krds-btn-secondary">목록</a>
            <span class="grow"></span>
            <button type="submit" th:if="${siteForm.siteId}"
                    th:formaction="@{/adm/site/delete}" formnovalidate
                    class="krds-btn krds-btn-point"
                    data-confirm="이 사이트를 삭제할까요? 메뉴·컨텐츠는 남지만 화면은 열리지 않습니다.">삭제</button>
            <span class="grow"></span>
        </div>
        </form>
        </div>
    </section>
</div>
</body>
</html>
