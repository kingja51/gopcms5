<!DOCTYPE html>
<!-- 관리자 2단계 인증 등록 — /adm/2fa/setup.
     QR 은 서버 생성 data: URI (외부 차트 서비스로 시크릿을 보내지 않는다 — CSP img-src 'self' data:).
     그룹 정책이 2FA 필수인 계정은 등록을 마칠 때까지 다른 관리 화면으로 나갈 수 없다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-adm/layout}">
<head>
    <title>2단계 인증 등록</title>
</head>
<body>
<div layout:fragment="content">
    <header th:replace="~{adm/fragments/adm-ui :: pageHead('2단계 인증 등록',
            '인증 앱(Google Authenticator 등)으로 아래 QR 을 스캔한 뒤, 앱에 표시된 6자리 코드를 입력하세요.')}"></header>

    <div th:if="${error}" role="alert" class="krds-alert krds-alert-danger"
         style="margin-bottom:16px">
        <span aria-hidden="true">✕</span><p th:text="${error}">오류</p>
    </div>

    <section class="ladm-panel" style="max-width:720px">
        <div class="ladm-panel-body ladm-tfa">
            <!-- ① QR -->
            <img th:src="${qrDataUri}" alt="2단계 인증 등록용 QR 코드"
                 width="220" height="220" class="ladm-tfa-qr"/>

            <!-- ② 수동 입력 + 확인 -->
            <div class="ladm-tfa-body">
                <p class="text-label-md text-fg-strong" style="margin:0">
                    QR 을 쓸 수 없을 때 — 수동 입력 키</p>
                <p class="ladm-tfa-secret text-body-sm" th:text="${secret}">SECRET</p>
                <p class="text-body-xs text-fg-subtle">
                    등록을 마치기 전에는 계정에 저장되지 않습니다. 페이지를 벗어나면 키가 새로 발급됩니다.</p>

                <form th:action="@{/adm/2fa/setup}" method="post" class="ladm-form"
                      style="margin-top:20px">
                    <div class="ladm-field">
                        <label for="totpCode" class="text-label-md">앱에 표시된 6자리 코드<span
                                class="ladm-req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
                        <input id="totpCode" name="totpCode" type="text" inputmode="numeric"
                               class="krds-input" autocomplete="one-time-code" required autofocus/>
                    </div>
                    <div class="ladm-actions">
                        <button type="submit" class="krds-btn krds-btn-primary">등록 완료</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>
</body>
</html>
