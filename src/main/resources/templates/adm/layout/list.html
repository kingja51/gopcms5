<!DOCTYPE html>
<!-- 레이아웃 목록 — 코드가 곧 뷰 폴더명(templates/layouts/{code}/). -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-adm/layout}">
<head>
    <title>레이아웃 관리</title>
</head>
<body>
<div layout:fragment="content">
    <header th:replace="~{adm/fragments/adm-ui :: pageHead('레이아웃 관리',
            '화면 구조(3축 중 구조) — 코드는 뷰 폴더명 <code>templates/layouts/{코드}/</code> 와 1:1 입니다.')}"></header>

    <div th:replace="~{adm/fragments/adm-ui :: flash}"></div>
    <section class="ladm-panel">
    <div th:replace="~{adm/fragments/adm-ui :: listbar('/adm/layout')}"></div>

    <div class="ladm-tablewrap">

      <table class="krds-table krds-table-zebra">
                <caption class="sr-only">레이아웃 목록</caption>
        <thead>
        <tr>
            <th scope="col">코드</th><th scope="col">이름</th><th scope="col">설계안</th><th scope="col">설명</th>
            <th scope="col" class="num">정렬</th><th scope="col" class="num">사용 사이트</th><th scope="col" class="center">사용</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${page.content()}">
            <td><a th:href="@{/adm/layout/form(layoutId=${l.layoutId})}" class="krds-link"
                   th:text="${l.layoutCode}">layout-001</a></td>
            <td th:text="${l.layoutName}">표준형</td>
            <td th:text="${l.wireframeRef} ?: '-'">frame001</td>
            <td th:text="${l.description} ?: '-'">-</td>
            <td class="num" th:text="${l.sortOrder}">0</td>
            <td class="num" th:text="${l.siteCount}">0</td>
            <td class="center">
                <span class="krds-badge"
                      th:classappend="${l.useYn == 'Y'} ? 'ladm-badge-on' : 'ladm-badge-off'"
                      th:text="${l.useYn == 'Y'} ? '사용' : '중지'">사용</span>
            </td>
        </tr>
        <tr
            th:replace="~{adm/fragments/adm-ui :: empty(7, ${page.content().isEmpty()}, '/adm/layout/form')}"></tr>
        </tbody>
      </table>
    </div>
    </section>

    <nav th:replace="~{adm/fragments/adm-ui :: pager('/adm/layout')}"></nav>
</div>
</body>
</html>
