<!DOCTYPE html>
<!-- 컨텐츠 등록·수정 — 본문은 HTML 그대로 저장되며 사용자 화면에서 th:utext 로 출력된다.
     (에디터·업로드·sanitize 정책 강화는 파일 업로드 페이즈에서) -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-adm/layout}">
<head>
    <title>컨텐츠 등록·수정</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="text-heading-lg"
        th:text="${content.contentId} ? '컨텐츠 수정' : '컨텐츠 등록'">컨텐츠 등록</h1>

    <div th:replace="~{adm/fragments/adm-ui :: flash}"></div>

    <form th:action="@{/adm/content/save}" method="post" class="ladm-form" style="max-width:900px">
        <input type="hidden" name="contentId" th:value="${content.contentId}"/>

        <div class="ladm-form-row">
            <div class="ladm-field">
                <label for="siteId">사이트 *</label>
                <select id="siteId" name="siteId" required>
                    <option th:each="s : ${sites}" th:value="${s.siteId}"
                            th:selected="${s.siteId == content.siteId}"
                            th:text="${s.siteCode + ' — ' + s.siteName}">site</option>
                </select>
            </div>
            <div class="ladm-field">
                <label for="menuId">연결 메뉴</label>
                <select id="menuId" name="menuId">
                    <option value="">연결 안 함</option>
                    <option th:each="m : ${menus}" th:value="${m.menuId}"
                            th:selected="${m.menuId == content.menuId}"
                            th:text="${#strings.repeat('— ', m.depth - 1) + m.menuName}">메뉴</option>
                </select>
                <p class="ladm-hint">breadcrumb 경로가 이 연결로 만들어집니다.</p>
            </div>
        </div>

        <div class="ladm-field">
            <label for="title">제목 *</label>
            <input id="title" name="title" class="krds-input" required th:value="${content.title}"/>
        </div>

        <div class="ladm-field">
            <label for="slug">slug (주소) *</label>
            <input id="slug" name="slug" class="krds-input" required th:value="${content.slug}"
                   pattern="[a-z0-9-]{1,200}"/>
            <p class="ladm-hint">소문자·숫자·하이픈만. 사이트 안에서 유일해야 하며,
                예약어(index·sitemap·search·member·bbs·prg·adm·api)는 쓸 수 없습니다.</p>
        </div>

        <div class="ladm-field">
            <label for="summary">요약</label>
            <input id="summary" name="summary" class="krds-input" th:value="${content.summary}"/>
            <p class="ladm-hint">홈 '새소식' 목록에 노출됩니다.</p>
        </div>

        <div class="ladm-field">
            <label for="body">본문 (HTML)</label>
            <textarea id="body" name="body" style="min-height:320px"
                      th:text="${content.body}"></textarea>
        </div>

        <div class="ladm-form-row">
            <div class="ladm-field">
                <label for="status">상태 *</label>
                <select id="status" name="status" required>
                    <option value="DRAFT" th:selected="${content.status == 'DRAFT'}">초안 (비공개)</option>
                    <option value="PUBLISHED" th:selected="${content.status == 'PUBLISHED'}">게시</option>
                    <option value="ARCHIVED" th:selected="${content.status == 'ARCHIVED'}">보관</option>
                </select>
                <p class="ladm-hint">게시로 바꾸면 게시일시가 비어 있을 때 현재 시각으로 채워집니다.</p>
            </div>
            <div class="ladm-field">
                <label for="unpublishAt">게시 종료 일시</label>
                <input id="unpublishAt" name="unpublishAt" type="datetime-local" class="krds-input"
                       th:value="${content.unpublishAt} != null ? ${#temporals.format(content.unpublishAt, 'yyyy-MM-dd''T''HH:mm')} : ''"/>
            </div>
        </div>

        <div class="ladm-form-row">
            <div class="ladm-field">
                <label for="metaKeywords">메타 키워드</label>
                <input id="metaKeywords" name="metaKeywords" class="krds-input"
                       th:value="${content.metaKeywords}"/>
            </div>
            <div class="ladm-field">
                <label for="metaDescription">메타 설명</label>
                <input id="metaDescription" name="metaDescription" class="krds-input"
                       th:value="${content.metaDescription}"/>
            </div>
        </div>

        <div class="ladm-actions">
            <button type="submit" class="krds-btn krds-btn-primary">저장</button>
            <a th:href="@{/adm/content(siteId=${content.siteId})}" class="krds-btn krds-btn-secondary">목록</a>
        </div>
    </form>

    <form th:if="${content.contentId}" th:action="@{/adm/content/delete}" method="post"
          style="margin-top:12px">
        <input type="hidden" name="contentId" th:value="${content.contentId}"/>
        <input type="hidden" name="siteId" th:value="${content.siteId}"/>
        <button type="submit" class="krds-btn krds-btn-tertiary"
                data-confirm="이 컨텐츠를 삭제할까요?">삭제</button>
    </form>
</div>
</body>
</html>
