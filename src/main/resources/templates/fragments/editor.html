<!DOCTYPE html>
<!-- ============================================================================
     위지윅 에디터 — <b>대외 계약은 이 파일 하나</b>.

     쓰는 법 (폼 안에서):
       <th:block th:replace="~{fragments/editor :: editor(
           field='content',                (폼 필드명 — 그대로 저장된다)
           value=${article.content},
           entityId=${article.articleId},  (본문 이미지 업로드 소유자)
           siteId=${master.siteId})}"/>

       그리고 레이아웃 scripts 슬롯에서:
       <th:block th:replace="~{fragments/editor :: assets}"/>

     설계 메모
       · 폼 화면은 provider 를 <b>모른다</b>. 분기는 여기서 한 번만 한다
         (tiptap / namo / ckeditor5 — application.yml 의 gopcms.editor.provider).
       · 저장되는 값은 언제나 <textarea name="{field}"> 다. provider 어댑터가
         제출 직전에 편집 결과를 그 안에 써 넣는다. 서버 바인딩은 그대로다.
       · JS 를 못 쓰는 환경에서도 textarea 그대로 입력·저장이 된다(점진적 향상).
       · 본문 정화는 provider 와 무관하게 저장 시점 한 곳(HtmlSanitizer)에서 한다.
     ============================================================================ -->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="editor(field, value, entityId, siteId)" class="gp-editor">
    <!-- 실제 폼 값. 에디터가 붙으면 화면에서 감춰지고 제출 직전에 채워진다 -->
    <textarea class="krds-input gp-editor-textarea"
              th:id="'gp-editor-src-' + ${field}"
              th:name="${field}" th:text="${value}" rows="14"></textarea>

    <!-- provider 별 마운트 지점 — 어느 조각이 붙을지는 설정이 정한다 -->
    <th:block th:replace="~{${editorFragment} :: mount(
            targetId='gp-editor-src-' + ${field},
            entityId=${entityId},
            siteId=${siteId})}"/>
</div>

<!--
  자산 로드 — 레이아웃의 scripts 슬롯에서 부른다.
  provider 가 바뀌면 여기서 나가는 파일 목록이 통째로 바뀐다(EditorProvider 가 원천).
-->
<th:block th:fragment="assets" th:remove="tag">
    <link th:each="href : ${editorStyles}" rel="stylesheet" th:href="@{${href}}"/>
    <script th:each="src : ${editorScripts}" th:src="@{${src}}" defer></script>
</th:block>

</body>
</html>
