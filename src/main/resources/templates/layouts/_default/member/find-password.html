<!DOCTYPE html>
<!-- 비밀번호 찾기 — 계정이 있든 없든 같은 안내로 끝난다(계정 존재 노출 방지).
     임시 비밀번호는 화면에 띄우지 않는다 — 메일로만 간다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${siteLayout}}">
<head>
    <title th:text="'비밀번호 찾기 — ' + ${site != null ? site.siteName : ''}">비밀번호 찾기</title>
    <link rel="stylesheet" href="/css/board.css"/>
</head>
<body>
<main layout:fragment="content">

    <header class="bbs-head">
        <h1 class="text-heading-lg">비밀번호 찾기</h1>
        <p class="text-body-md text-fg-subtle">
            아이디와 가입할 때 등록한 이메일을 입력하면 임시 비밀번호를 보내 드립니다.</p>
    </header>

    <div th:if="${submitted}" class="krds-alert krds-alert-info" role="status"
         style="max-width:640px;margin:0 auto 24px">
        <span aria-hidden="true">i</span>
        <p>
            입력하신 정보와 일치하는 계정이 있다면 <b>등록된 이메일로 임시 비밀번호</b>를
            보냈습니다. 메일이 보이지 않으면 스팸함도 확인해 주세요.<br/>
            임시 비밀번호로 로그인하면 <b>새 비밀번호로 변경</b>해야 합니다.
        </p>
    </div>

    <form method="post" class="bbs-form"
          th:action="@{'/' + ${site.siteCode} + '/member/find-password'}">
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="loginId">아이디</label>
            <input id="loginId" name="loginId" class="krds-input" required maxlength="30"
                   autocomplete="username"/>
        </div>
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="email">이메일</label>
            <input id="email" name="email" type="email" class="krds-input" required
                   maxlength="255" autocomplete="email"/>
        </div>
        <div class="bbs-actions">
            <button type="submit" class="krds-btn krds-btn-primary">임시 비밀번호 받기</button>
            <a th:href="@{'/' + ${site.siteCode} + '/member/find-id'}"
               class="krds-btn krds-btn-secondary">아이디 찾기</a>
        </div>
    </form>

</main>
</body>
</html>
