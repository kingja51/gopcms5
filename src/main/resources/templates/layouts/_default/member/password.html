<!DOCTYPE html>
<!-- 회원 비밀번호 변경 — 관리자 화면(/adm/password)과 같은 서비스·같은 규칙을 쓴다.
     최근 이력 재사용 금지·구성 규칙은 PasswordService 가 판정한다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${siteLayout}}">
<head>
    <title>비밀번호 변경</title>
    <link rel="stylesheet" href="/css/board.css"/>
</head>
<body>
<main layout:fragment="content">

    <header class="bbs-head">
        <h1 class="text-heading-lg">비밀번호 변경</h1>
        <p class="text-body-md text-fg-subtle">
            2종류 조합 10자 이상 또는 3종류 조합 8자 이상. 최근에 쓰던 비밀번호는 다시 쓸 수 없습니다.</p>
    </header>

    <div th:replace="~{fragments/board/flash :: flash}"></div>

    <form method="post" class="bbs-form"
          th:action="@{'/' + ${site.siteCode} + '/member/mypage/password'}">
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="currentPassword">현재 비밀번호</label>
            <input id="currentPassword" name="currentPassword" type="password"
                   class="krds-input" required autocomplete="current-password"/>
        </div>
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="newPassword">새 비밀번호</label>
            <input id="newPassword" name="newPassword" type="password"
                   class="krds-input" required autocomplete="new-password"/>
        </div>
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="confirmPassword">새 비밀번호 확인</label>
            <input id="confirmPassword" name="confirmPassword" type="password"
                   class="krds-input" required autocomplete="new-password"/>
        </div>
        <div class="bbs-actions">
            <button type="submit" class="krds-btn krds-btn-primary">변경</button>
            <a th:href="@{'/' + ${site.siteCode} + '/member/mypage'}"
               class="krds-btn krds-btn-secondary">취소</a>
        </div>
    </form>

</main>
</body>
</html>
