<!DOCTYPE html>
<!-- ============================================================================
     휴면 계정 복원 — 2단계.
     ① 아이디+비밀번호 확인(둘 다 맞아야 휴면으로 인정 — 아이디만으로 알려 주면
        계정 존재가 새어 나간다)  ② 이메일로 받은 6자리 인증번호
     실패 사유는 구분하지 않는다(만료인지 오답인지 알려 주면 대입에 도움이 된다).
     ============================================================================ -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${siteLayout}}">
<head>
    <title>휴면 계정 복원</title>
    <link rel="stylesheet" href="/css/board.css"/>
    <link rel="stylesheet" href="/css/member.css"/>
    <script src="/js/nice-auth.js" defer></script>
</head>
<body>
<main layout:fragment="content">

    <header class="bbs-head">
        <h1 class="text-heading-lg">휴면 계정 복원</h1>
        <p class="text-body-md text-fg-subtle">
            장기간 접속하지 않아 휴면 상태로 전환된 계정을 다시 사용할 수 있게 합니다.</p>
    </header>

    <div th:replace="~{fragments/board/flash :: flash}"></div>
    <div th:if="${flashOk}" class="krds-alert krds-alert-success" role="status"
         style="max-width:640px;margin:0 auto 24px">
        <span aria-hidden="true">✓</span><p th:text="${flashOk}">완료</p>
    </div>
    <div th:if="${flashError}" class="krds-alert krds-alert-danger" role="alert"
         style="max-width:640px;margin:0 auto 24px">
        <span aria-hidden="true">!</span><p th:text="${flashError}">오류</p>
    </div>

    <!-- 실명인증 경로 — 아이디·비밀번호를 묻지 않는다.
         비밀번호를 잊어 못 들어오는 것이 휴면의 흔한 사정이라, 그걸 요구하면
         복원 수단이 하나 더 필요해진다. -->
    <div th:if="${niceReady and !hasTarget}" class="join-verify"
         style="max-width:640px;margin:0 auto 24px">
        <p class="text-body-md" style="margin:0">
            <b>실명인증으로 바로 복원</b></p>
        <p>가입할 때 본인인증을 하셨다면 아이디·비밀번호 없이 복원할 수 있습니다.</p>
        <button type="button" class="krds-btn krds-btn-primary"
                style="margin-top:16px" th:attr="data-nice-open=${niceUrl}">
            실명인증으로 복원</button>
    </div>

    <p th:if="${niceReady and !hasTarget}" class="social-divider"
       style="max-width:640px;margin:0 auto">또는 아이디·비밀번호로 확인</p>

    <!-- ① 본인 확인 -->
    <form th:unless="${hasTarget}" method="post" class="bbs-form"
          th:action="@{'/' + ${site.siteCode} + '/member/dormant/check'}">
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="loginId">아이디</label>
            <input id="loginId" name="loginId" class="krds-input" required maxlength="30"
                   autocomplete="username"/>
        </div>
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="password">비밀번호</label>
            <div>
                <input id="password" name="password" type="password" class="krds-input"
                       required autocomplete="current-password"/>
                <p class="text-body-xs text-fg-subtle">
                    휴면 전에 쓰던 비밀번호를 입력해 주세요.</p>
            </div>
        </div>
        <div class="bbs-actions">
            <button type="submit" class="krds-btn krds-btn-primary">인증번호 받기</button>
            <a th:href="@{'/login'(siteCode=${site.siteCode})}"
               class="krds-btn krds-btn-secondary">로그인으로</a>
        </div>
    </form>

    <!-- ② 인증번호 입력 -->
    <th:block th:if="${hasTarget}">
        <form method="post" class="bbs-form"
              th:action="@{'/' + ${site.siteCode} + '/member/dormant/verify'}">
            <div class="bbs-form-row">
                <label class="bbs-form-label" for="code">인증번호</label>
                <div>
                    <input id="code" name="code" class="krds-input" required maxlength="6"
                           inputmode="numeric" autocomplete="one-time-code" autofocus
                           style="max-width:160px;letter-spacing:.3em"/>
                    <p class="text-body-xs text-fg-subtle">
                        메일로 받은 6자리 숫자입니다. 유효시간이 지나면 다시 받아야 합니다.</p>
                </div>
            </div>
            <div class="bbs-actions">
                <button type="submit" class="krds-btn krds-btn-primary">복원하기</button>
            </div>
        </form>

        <form method="post" style="text-align:center;margin-top:12px"
              th:action="@{'/' + ${site.siteCode} + '/member/dormant/resend'}">
            <button type="submit" class="krds-btn krds-btn-text krds-btn-sm">
                인증번호가 오지 않았나요? 다시 받기</button>
        </form>
    </th:block>

</main>
</body>
</html>
