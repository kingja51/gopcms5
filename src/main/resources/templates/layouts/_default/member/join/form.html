<!DOCTYPE html>
<!-- ============================================================================
     가입 STEP 4 — 정보 입력.
     본인인증을 마쳤으면 이름·생년월일·성별은 인증기관 값이라 읽기 전용으로 보여 준다.
     (readonly 는 안내일 뿐이다 — 전송 값은 얼마든지 바뀌므로 서버가 저장 직전에
      wizard 값으로 다시 덮어쓴다. MemberJoinServiceImpl.applyVerifiedIdentity)
     비밀번호는 실패 시 폼에 되돌리지 않는다.
     ============================================================================ -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${siteLayout}}">
<head>
    <title th:text="'회원가입 — ' + ${site != null ? site.siteName : ''}">회원가입</title>
    <link rel="stylesheet" href="/css/board.css"/>
    <link rel="stylesheet" href="/css/member.css"/>
</head>
<body>
<main layout:fragment="content">

    <header class="bbs-head">
        <h1 class="text-heading-lg">회원가입</h1>
        <p class="text-body-md text-fg-subtle">회원 정보를 입력해 주세요.</p>
    </header>

    <div th:replace="~{fragments/member/join-steps :: steps(${step}, ${identityRequired})}"></div>

    <div th:if="${flashError}" class="krds-alert krds-alert-danger" role="alert"
         style="margin-bottom:24px">
        <span aria-hidden="true">!</span><p th:text="${flashError}">오류</p>
    </div>

    <div th:if="${join.verified}" class="krds-alert krds-alert-success" role="status"
         style="margin-bottom:24px">
        <span aria-hidden="true">✓</span>
        <p th:text="${join.child}
                    ? '법정대리인 본인확인이 완료되었습니다: ' + ${join.parentName}
                    : '본인확인이 완료되었습니다: ' + ${join.verifiedName}">확인 완료</p>
    </div>

    <div th:if="${join.hasOauth()}" class="krds-alert krds-alert-info" role="status"
         style="margin-bottom:24px">
        <span aria-hidden="true">i</span>
        <p><span th:text="${join.oauthProvider}">NAVER</span> 계정으로 가입합니다.
           가입 후 해당 계정으로 로그인할 수 있습니다.</p>
    </div>

    <form method="post" th:object="${joinForm}" class="bbs-form"
          th:action="@{'/' + ${site.siteCode} + '/member/join/form'}">

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="loginId">아이디</label>
            <div>
                <input id="loginId" th:field="*{loginId}" class="krds-input" required
                       maxlength="30" autocomplete="username"/>
                <p class="text-body-xs text-fg-subtle">
                    영문 소문자로 시작하는 4~30자(소문자·숫자·_·-)</p>
            </div>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="password">비밀번호</label>
            <div>
                <input id="password" th:field="*{password}" type="password" class="krds-input"
                       required autocomplete="new-password"/>
                <p class="text-body-xs text-fg-subtle">
                    2종류 조합 10자 이상 또는 3종류 조합 8자 이상</p>
            </div>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm" th:field="*{passwordConfirm}" type="password"
                   class="krds-input" required autocomplete="new-password"/>
        </div>

        <!-- 인증을 마친 성인 회원 — 이름/생년월일/성별은 인증기관 값 -->
        <th:block th:if="${join.verified and !join.child}">
            <div class="bbs-form-row">
                <label class="bbs-form-label" for="memberName">이름</label>
                <div>
                    <input id="memberName" th:field="*{memberName}" class="krds-input"
                           readonly/>
                    <p class="text-body-xs text-fg-subtle">본인인증으로 확인된 이름입니다.</p>
                </div>
            </div>
            <div class="bbs-form-row">
                <label class="bbs-form-label" for="birthDate">생년월일</label>
                <input id="birthDate" th:field="*{birthDate}" class="krds-input" readonly/>
            </div>
            <div class="bbs-form-row">
                <label class="bbs-form-label" for="genderView">성별</label>
                <div>
                    <input id="genderView" class="krds-input" readonly
                           th:value="*{gender} == 'M' ? '남성' : (*{gender} == 'F' ? '여성' : '미확인')"/>
                    <input type="hidden" th:field="*{gender}"/>
                </div>
            </div>
        </th:block>

        <!-- 미인증 또는 소아·청소년 — 본인 정보는 직접 입력 -->
        <th:block th:unless="${join.verified and !join.child}">
            <div class="bbs-form-row">
                <label class="bbs-form-label" for="memberNameInput">이름</label>
                <input id="memberNameInput" th:field="*{memberName}" class="krds-input" required
                       maxlength="50" autocomplete="name"/>
            </div>
            <div class="bbs-form-row">
                <label class="bbs-form-label" for="birthDateInput">생년월일</label>
                <input id="birthDateInput" th:field="*{birthDate}" class="krds-input" maxlength="8"
                       placeholder="YYYYMMDD" inputmode="numeric"/>
            </div>
            <div class="bbs-form-row">
                <label class="bbs-form-label" for="gender">성별</label>
                <select id="gender" th:field="*{gender}" class="krds-select">
                    <option value="N">선택 안 함</option>
                    <option value="M">남성</option>
                    <option value="F">여성</option>
                </select>
            </div>
        </th:block>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="nickname">닉네임</label>
            <input id="nickname" th:field="*{nickname}" class="krds-input" maxlength="50"/>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="email">이메일</label>
            <input id="email" th:field="*{email}" type="email" class="krds-input" required
                   maxlength="255" autocomplete="email"/>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="phone">휴대전화</label>
            <div>
                <input id="phone" th:field="*{phone}" class="krds-input" maxlength="20"
                       autocomplete="tel" inputmode="numeric"/>
                <p class="text-body-xs text-fg-subtle">숫자만 저장됩니다(하이픈은 지워집니다).</p>
            </div>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="addressZipcode">우편번호</label>
            <input id="addressZipcode" th:field="*{addressZipcode}" class="krds-input"
                   maxlength="10" style="max-width:140px" inputmode="numeric"/>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="address">주소</label>
            <div>
                <input id="address" th:field="*{address}" class="krds-input" maxlength="200"
                       autocomplete="street-address"/>
                <input id="addressDetail" th:field="*{addressDetail}" class="krds-input"
                       maxlength="200" placeholder="상세주소" style="margin-top:8px"/>
            </div>
        </div>

        <div class="bbs-actions">
            <button type="submit" class="krds-btn krds-btn-primary">가입하기</button>
            <a th:href="@{'/' + ${site.siteCode} + '/member/join'}"
               class="krds-btn krds-btn-secondary">처음부터</a>
        </div>
    </form>

</main>
</body>
</html>
