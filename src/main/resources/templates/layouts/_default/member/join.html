<!DOCTYPE html>
<!-- ============================================================================
     회원 가입 — 공용 1벌(7종 레이아웃 어디에 얹혀도 동작).
     · 필수 동의 2종은 서버가 다시 본다 — 화면에서 감춰도 통과하지 않는다
     · 비밀번호는 실패 시 폼에 되돌리지 않는다(컨트롤러가 비운다)
     ============================================================================ -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${siteLayout}}">
<head>
    <title th:text="'회원가입 — ' + ${site != null ? site.siteName : ''}">회원가입</title>
    <link rel="stylesheet" href="/css/board.css"/>
</head>
<body>
<main layout:fragment="content">

    <header class="bbs-head">
        <h1 class="text-heading-lg">회원가입</h1>
        <p class="text-body-md text-fg-subtle">
            <span th:text="${site != null ? site.siteName : ''}">사이트</span> 회원으로 가입합니다.
        </p>
    </header>

    <div th:replace="~{fragments/board/flash :: flash}"></div>

    <form method="post" th:object="${joinForm}" class="bbs-form"
          th:action="@{'/' + ${site.siteCode} + '/member/join'}">

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="loginId">아이디</label>
            <div>
                <input id="loginId" th:field="*{loginId}" class="krds-input" required
                       maxlength="30" autocomplete="username"/>
                <p class="text-body-xs text-fg-subtle">
                    영문 소문자로 시작하는 4~30자(소문자·숫자·_·-)</p>
            </div>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="password">비밀번호</label>
            <div>
                <input id="password" th:field="*{password}" type="password" class="krds-input"
                       required autocomplete="new-password"/>
                <p class="text-body-xs text-fg-subtle">
                    2종류 조합 10자 이상 또는 3종류 조합 8자 이상</p>
            </div>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm" th:field="*{passwordConfirm}" type="password"
                   class="krds-input" required autocomplete="new-password"/>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="memberName">이름</label>
            <input id="memberName" th:field="*{memberName}" class="krds-input" required
                   maxlength="50" autocomplete="name"/>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="nickname">닉네임</label>
            <input id="nickname" th:field="*{nickname}" class="krds-input" maxlength="50"/>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="email">이메일</label>
            <input id="email" th:field="*{email}" type="email" class="krds-input" required
                   maxlength="255" autocomplete="email"/>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="phone">휴대전화</label>
            <div>
                <input id="phone" th:field="*{phone}" class="krds-input" maxlength="20"
                       autocomplete="tel" inputmode="numeric"/>
                <p class="text-body-xs text-fg-subtle">숫자만 저장됩니다(하이픈은 지워집니다).</p>
            </div>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="birthDate">생년월일</label>
            <input id="birthDate" th:field="*{birthDate}" class="krds-input" maxlength="8"
                   placeholder="YYYYMMDD" inputmode="numeric"/>
        </div>

        <div class="bbs-form-row">
            <label class="bbs-form-label" for="gender">성별</label>
            <select id="gender" th:field="*{gender}" class="krds-select">
                <option value="N">선택 안 함</option>
                <option value="M">남성</option>
                <option value="F">여성</option>
            </select>
        </div>

        <div class="bbs-form-row">
            <span class="bbs-form-label">약관 동의</span>
            <div>
                <label class="bbs-check">
                    <input type="checkbox" th:field="*{termsAgreeYn}" value="Y" required/>
                    <b>[필수]</b> 이용약관에 동의합니다</label>
                <br/>
                <label class="bbs-check">
                    <input type="checkbox" th:field="*{privacyAgreeYn}" value="Y" required/>
                    <b>[필수]</b> 개인정보 수집·이용에 동의합니다</label>
                <br/>
                <label class="bbs-check">
                    <input type="checkbox" th:field="*{marketingAgreeYn}" value="Y"/>
                    [선택] 마케팅 정보 수신에 동의합니다</label>
                <br/>
                <label class="bbs-check">
                    <input type="checkbox" th:field="*{smsAgreeYn}" value="Y"/>
                    [선택] SMS 수신</label>
                <label class="bbs-check">
                    <input type="checkbox" th:field="*{emailAgreeYn}" value="Y"/>
                    [선택] 이메일 수신</label>
                <p class="text-body-xs text-fg-subtle">
                    동의 여부는 <b>동의하지 않음까지 포함해</b> 이력으로 남습니다.</p>
            </div>
        </div>

        <div class="bbs-actions">
            <button type="submit" class="krds-btn krds-btn-primary">가입하기</button>
            <a th:href="@{'/login'(siteCode=${site.siteCode})}"
               class="krds-btn krds-btn-secondary">로그인으로</a>
        </div>
    </form>

</main>
</body>
</html>
