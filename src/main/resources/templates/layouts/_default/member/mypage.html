<!DOCTYPE html>
<!-- ============================================================================
     마이페이지 — step-up 재인증(5분)을 통과해야 열린다.
     수정 불가 값(아이디·생년월일·성별)은 읽기 전용으로 보여준다. 폼 DTO 에 아예 없으므로
     화면에서 지운다고 될 일이 아니라 어떤 경로로도 서버에 들어가지 않는다.
     ============================================================================ -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${siteLayout}}">
<head>
    <title>내 정보</title>
    <link rel="stylesheet" href="/css/board.css"/>
</head>
<body>
<main layout:fragment="content">

    <header class="bbs-head">
        <h1 class="text-heading-lg">내 정보</h1>
        <p class="text-body-md text-fg-subtle">
            본인 확인 후 5분 동안 열람·수정할 수 있습니다.</p>
    </header>

    <div th:replace="~{fragments/board/flash :: flash}"></div>

    <form method="post" class="bbs-form"
          th:action="@{'/' + ${site.siteCode} + '/member/mypage'}">

        <!-- 바꿀 수 없는 값 — 본인확인 근간이라 화면에서도 입력을 열지 않는다 -->
        <div class="bbs-form-row">
            <span class="bbs-form-label">아이디</span>
            <div>
                <b th:text="${member.loginId}">user1</b>
                <p class="text-body-xs text-fg-subtle">아이디는 변경할 수 없습니다.</p>
            </div>
        </div>
        <div class="bbs-form-row">
            <span class="bbs-form-label">이름</span>
            <div>
                <span th:text="${member.memberName}">홍길동</span>
                <p class="text-body-xs text-fg-subtle">
                    이름·생년월일·성별은 본인확인 정보라 변경할 수 없습니다.</p>
            </div>
        </div>
        <div class="bbs-form-row" th:if="${member.birthDate != null}">
            <span class="bbs-form-label">생년월일</span>
            <span th:text="${member.birthDate}">19900101</span>
        </div>

        <!-- 여기서부터 수정 가능 -->
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="nickname">닉네임</label>
            <input id="nickname" name="nickname" class="krds-input" maxlength="50"
                   th:value="${member.nickname}"/>
        </div>
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="email">이메일</label>
            <div>
                <input id="email" name="email" type="email" class="krds-input" required
                       maxlength="255" th:value="${member.email}"/>
                <p class="text-body-xs text-fg-subtle"
                   th:if="${member.emailVerifiedYn != 'Y'}">
                    아직 인증되지 않은 주소입니다. 이메일을 바꾸면 인증을 다시 받아야 합니다.</p>
            </div>
        </div>
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="phone">휴대전화</label>
            <input id="phone" name="phone" class="krds-input" maxlength="20"
                   inputmode="numeric" th:value="${member.phone}"/>
        </div>
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="addressZipcode">우편번호</label>
            <input id="addressZipcode" name="addressZipcode" class="krds-input" maxlength="10"
                   th:value="${member.addressZipcode}"/>
        </div>
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="address">주소</label>
            <input id="address" name="address" class="krds-input" maxlength="255"
                   th:value="${member.address}"/>
        </div>
        <div class="bbs-form-row">
            <label class="bbs-form-label" for="addressDetail">상세주소</label>
            <input id="addressDetail" name="addressDetail" class="krds-input" maxlength="255"
                   th:value="${member.addressDetail}"/>
        </div>

        <div class="bbs-form-row">
            <span class="bbs-form-label">수신 동의</span>
            <div>
                <label class="bbs-check">
                    <input type="checkbox" name="marketingAgreeYn" value="Y"
                           th:checked="${member.marketingAgreeYn == 'Y'}"/> 마케팅 정보</label>
                <label class="bbs-check">
                    <input type="checkbox" name="smsAgreeYn" value="Y"
                           th:checked="${member.smsAgreeYn == 'Y'}"/> SMS</label>
                <label class="bbs-check">
                    <input type="checkbox" name="emailAgreeYn" value="Y"
                           th:checked="${member.emailAgreeYn == 'Y'}"/> 이메일</label>
                <p class="text-body-xs text-fg-subtle">
                    변경 내역은 이력으로 남습니다(언제 껐는지도 기록됩니다).</p>
            </div>
        </div>

        <div class="bbs-actions">
            <button type="submit" class="krds-btn krds-btn-primary">저장</button>
            <a th:href="@{'/' + ${site.siteCode} + '/member/mypage/password'}"
               class="krds-btn krds-btn-secondary">비밀번호 변경</a>
            <a th:href="@{'/' + ${site.siteCode} + '/member/mypage/withdraw'}"
               class="krds-btn krds-btn-tertiary">회원 탈퇴</a>
        </div>
    </form>

</main>
</body>
</html>
