<!DOCTYPE html>
<!-- ============================================================================
     layout-adm — 관리자 전용 셸 (사이트 3축 무관: template/theme CSS 미로드)
     ----------------------------------------------------------------------------
     · 위치 규약(2026-07-28): 레이아웃은 종류 불문 templates/layouts/ 아래 집결.
       관리자 "프로그램 뷰"는 templates/adm/**, 사용자 프로그램 뷰는 templates/front/**
       (front/** 만 SiteTemplateViewResolver 가 사이트별 재작성 — adm/** 는 통과).
     · 구조: 상단바(브랜드·계정·로그아웃) + 좌측 LNB + 본문. 슬롯 = content / scripts.
     · CSS 2층만: 전역 output.css → /css/layouts/layout-adm.css (템플릿 램프 없음)
     · P7 관리 모듈이 LNB 항목을 실제 링크로 채운다 — 그 전까지 '예정' 비활성 표기.
     ============================================================================ -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE — $LAYOUT_TITLE">GOPCMS 관리자</title>
    <link rel="icon" href="data:,"/>
    <link rel="stylesheet" href="/css/output.css"/>
    <link rel="stylesheet" href="/css/layouts/layout-adm.css"/>
    <!-- 고대비(hc) 복원 — 첫 페인트 전(FOUC 방지). 인라인 예외는 여기 하나, CSP nonce 필수 -->
    <script th:attr="nonce=${cspNonce}">
        try { if (localStorage.getItem('gopcms5.hc') === '1')
            document.documentElement.classList.add('hc'); } catch (e) {}
    </script>
</head>
<body class="bg-bg text-fg">

<a class="ladm-skip" href="#content">본문으로 건너뛰기</a>

<!-- 상단바 -->
<header class="ladm-topbar">
    <a class="ladm-brand" th:href="@{/adm/index}">
        <b class="text-heading-2xs">GOPCMS</b><span class="text-body-sm">관리자</span>
    </a>
    <span class="grow"></span>
    <!--
      이전 로그인 일시 — 자격증명이 새면 정상 로그인처럼 보이므로, 본인이 "내가 접속한 적
      없는 시각" 을 알아채는 것이 사실상 유일한 단서다. 값이 없으면(첫 로그인) 감춘다.
    -->
    <span class="ladm-prevlogin" th:if="${previousLogin != null}">
        <span class="ladm-prevlogin-label text-label-xs">이전 로그인</span>
        <span class="ladm-prevlogin-value text-body-xs"
              th:text="${#temporals.format(previousLogin.attemptedAt, 'yyyy-MM-dd HH:mm')}"
              th:title="${'IP ' + (previousLogin.clientIp ?: '-')}">2026-07-08 17:45</span>
    </span>
    <span class="ladm-account text-body-sm">
        <span class="ladm-avatar text-label-sm" aria-hidden="true"
              th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">A</span>
        <span sec:authentication="name">admin</span>
    </span>
    <form th:action="@{/adm/logout}" method="post" style="margin:0">
        <button type="submit" class="krds-btn krds-btn-tertiary krds-btn-sm ladm-logout">로그아웃</button>
    </form>
</header>

<div class="ladm-shell">
    <!-- 좌측 LNB — P7 관리 모듈 순차 활성. aria-current 는 각 페이지가 지정 -->
    <nav class="ladm-lnb" aria-label="관리 메뉴">
        <p class="ladm-lnb-group text-label-xs">일반</p>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/index}"
           th:classappend="${currentUri == '/adm/index'} ? 'ladm-active'">대시보드</a>

        <p class="ladm-lnb-group text-label-xs">사이트 구성</p>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/site}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/adm/site')} ? 'ladm-active'">사이트 관리</a>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/template}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/adm/template')} ? 'ladm-active'">템플릿 관리</a>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/theme}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/adm/theme')} ? 'ladm-active'">테마 관리</a>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/layout}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/adm/layout')} ? 'ladm-active'">레이아웃 관리</a>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/menu}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/adm/menu')} ? 'ladm-active'">메뉴 관리</a>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/content}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/adm/content')} ? 'ladm-active'">컨텐츠 관리</a>

        <p class="ladm-lnb-group text-label-xs">회원·권한</p>
        <span class="ladm-lnb-link text-body-sm ladm-disabled">회원 관리 <em class="text-label-xs">예정</em></span>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/role}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/adm/role')} ? 'ladm-active'">역할 관리</a>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/url-access}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/adm/url-access')} ? 'ladm-active'">URL 접근 규칙</a>

        <p class="ladm-lnb-group text-label-xs">자료</p>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/board}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/adm/board')} ? 'ladm-active'">게시판 관리</a>
        <a class="ladm-lnb-link text-body-sm" th:href="@{/adm/file}"
           th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/adm/file')} ? 'ladm-active'">파일 관리</a>

        <p class="ladm-lnb-group text-label-xs">운영</p>
        <span class="ladm-lnb-link text-body-sm ladm-disabled">접속 로그 <em class="text-label-xs">예정</em></span>
        <span class="ladm-lnb-link text-body-sm ladm-disabled">공통 코드 <em class="text-label-xs">예정</em></span>
    </nav>

    <!-- 본문 -->
    <main id="content" class="ladm-main">
        <div layout:fragment="content">
            <p class="text-body-md text-fg-subtle">본문 슬롯 — 각 관리 페이지가 채웁니다.</p>
        </div>
    </main>
</div>

<footer class="ladm-footer text-body-xs text-fg-subtle">
    (주)지오넷 GOPCMS 5.0 — 관리자 콘솔
</footer>

<script src="/js/vendor/htmx.min.js" defer></script>
<script src="/js/app.js" defer></script>
<th:block layout:fragment="scripts"/>
</body>
</html>
