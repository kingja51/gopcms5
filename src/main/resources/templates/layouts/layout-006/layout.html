<!DOCTYPE html>
<!-- ============================================================================
     layout-006 — F안 모바일 퍼스트 앱형 (원전: wireframe/frame006)
     ----------------------------------------------------------------------------
     하나의 템플릿이 미디어쿼리로 두 모습을 낸다 — <b>별도 모바일 사이트가 아니다</b>.
       · 모바일: 상단 앱바(뒤로·제목·검색) + <b>하단 고정 탭바 5개</b>.
       · 데스크톱: 같은 5개가 <b>상단 탭</b>으로 올라가고 본문은 협폭 컬럼.
     탭 5개 = 홈 · 메뉴 상위 2그룹 · 검색 · 내정보. 메뉴가 적은 사이트도 무너지지 않게
     menuTree 앞 2개만 쓰고 나머지는 전체메뉴(사이트맵)로 보낸다.
     하단 탭바가 본문 끝을 가리므로 body 에 탭바 높이만큼 여백을 준다(구조 CSS).
     슬롯 계약·데이터·라우트는 A안과 동일.
     ============================================================================ -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:classappend="${themeClass}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${site != null ? site.siteName : 'gopcms5'}">gopcms5</title>
    <link rel="icon" href="data:,"/>
    <link rel="stylesheet" href="/css/output.css"/>
    <link rel="stylesheet" th:href="@{${'/tmpl/css/' + (site != null ? site.templateCode : 'krds') + '.css'}}"/>
    <link rel="stylesheet" href="/css/layouts/layout-006.css"/>
    <th:block th:if="${site != null and site.headMeta != null}" th:utext="${site.headMeta}"/>
    <script th:attr="nonce=${cspNonce}">
        try { if (localStorage.getItem('gopcms5.hc') === '1')
            document.documentElement.classList.add('hc'); } catch (e) {}
    </script>
</head>
<body class="bg-bg text-fg l6-body">

<a class="l6-skip" href="#content">본문으로 건너뛰기</a>

<!-- ① 앱바 — 모바일은 현재 페이지 제목, 데스크톱은 사이트명 -->
<header class="l6-appbar">
    <div class="l6-wrap l6-appbar-row">
        <a class="l6-brand text-label-lg"
           th:href="${site != null ? '/' + site.siteCode + '/index' : '/'}"
           th:text="${site != null ? site.siteName : 'gopcms5'}">사이트명</a>
        <b class="l6-pagetitle text-label-lg"
           th:if="${breadcrumb != null and !breadcrumb.isEmpty()}"
           th:text="${breadcrumb[breadcrumb.size() - 1].name}">페이지 제목</b>
        <span class="grow"></span>
        <button type="button" class="krds-btn krds-btn-text krds-btn-sm"
                data-action="toggle-hc" aria-pressed="false">◐</button>
        <button type="button" class="krds-btn krds-btn-text krds-btn-sm"
                data-action="open-dialog" data-target="#l6-menu" aria-label="전체 메뉴">☰</button>
    </div>

    <!-- 데스크톱 상단 탭 — 모바일에서는 숨기고 하단 탭바가 대신한다 -->
    <nav class="l6-wrap l6-toptabs" aria-label="주 메뉴">
        <a class="l6-tab" th:href="${site != null ? '/' + site.siteCode + '/index' : '/'}"
           th:classappend="${breadcrumb == null or breadcrumb.isEmpty()} ? 'l6-active'">
            <span aria-hidden="true">🏠</span><span class="text-label-sm">홈</span></a>
        <a class="l6-tab" th:each="m1, st : ${menuTree}" th:if="${st.index < 2}"
           th:href="${m1.href != null ? m1.href
                      : (m1.children != null and !m1.children.isEmpty() and m1.children[0].href != null
                         ? m1.children[0].href : '#')}"
           th:classappend="${breadcrumb != null and breadcrumb.contains(m1)} ? 'l6-active'">
            <span aria-hidden="true">📄</span><span class="text-label-sm" th:text="${m1.name}">메뉴</span></a>
        <a class="l6-tab" th:href="${site != null ? '/' + site.siteCode + '/sitemap' : '/main/sitemap'}">
            <span aria-hidden="true">🗂</span><span class="text-label-sm">전체</span></a>
        <a class="l6-tab" th:href="${site != null ? '/' + site.siteCode + '/search' : '/search'}">
            <span aria-hidden="true">🔍</span><span class="text-label-sm">검색</span></a>
        <a class="l6-tab" th:href="${site != null ? '/login?siteCode=' + site.siteCode : '/login'}">
            <span aria-hidden="true">👤</span><span class="text-label-sm">MY</span></a>
    </nav>
</header>

<!-- ② breadcrumb — 앱형이라 얇게 한 줄 (데스크톱에서만 의미가 커서 모바일은 숨김) -->
<nav class="l6-wrap l6-crumb" aria-label="현재 위치"
     th:if="${breadcrumb != null and !breadcrumb.isEmpty()}">
    <ol class="krds-breadcrumb text-body-xs">
        <li><a th:href="${site != null ? '/' + site.siteCode + '/index' : '/'}">홈</a></li>
        <li th:each="crumb, stat : ${breadcrumb}">
            <a th:if="${!stat.last and crumb.href != null}" th:href="${crumb.href}"
               th:text="${crumb.name}">메뉴</a>
            <span th:if="${!stat.last and crumb.href == null}" th:text="${crumb.name}">메뉴</span>
            <span th:if="${stat.last}" aria-current="page" th:text="${crumb.name}">현재</span>
        </li>
    </ol>
</nav>

<div id="sub-hero-slot"></div>

<!-- ③ 본문 — 협폭 컬럼(앱 화면 폭 감각을 데스크톱에서도 유지) -->
<main id="content" class="l6-wrap l6-content" layout:fragment="content">본문</main>

<!-- ④ 좋아요/신고 -->
<div th:if="${content != null}" class="l6-wrap l6-reaction">
    <button type="button" class="krds-btn krds-btn-tertiary krds-btn-sm" disabled>👍 좋아요</button>
    <button type="button" class="krds-btn krds-btn-text krds-btn-sm" disabled>🚩 신고</button>
    <span class="text-body-xs text-fg-disabled">(게시판 페이즈에서 활성)</span>
</div>

<footer th:replace="~{fragments/site-footer :: footer}"></footer>

<!-- ⑤ 하단 탭바 — 모바일 전용 고정. 상단 탭과 같은 5개(중복 아님, 반응형 전환) -->
<nav class="l6-tabbar" aria-label="주 메뉴 (모바일)">
    <a class="l6-tab" th:href="${site != null ? '/' + site.siteCode + '/index' : '/'}"
       th:classappend="${breadcrumb == null or breadcrumb.isEmpty()} ? 'l6-active'">
        <span aria-hidden="true">🏠</span><span class="text-label-xs">홈</span></a>
    <a class="l6-tab" th:each="m1, st : ${menuTree}" th:if="${st.index < 2}"
       th:href="${m1.href != null ? m1.href
                  : (m1.children != null and !m1.children.isEmpty() and m1.children[0].href != null
                     ? m1.children[0].href : '#')}"
       th:classappend="${breadcrumb != null and breadcrumb.contains(m1)} ? 'l6-active'">
        <span aria-hidden="true">📄</span><span class="text-label-xs" th:text="${m1.name}">메뉴</span></a>
    <a class="l6-tab" th:href="${site != null ? '/' + site.siteCode + '/sitemap' : '/main/sitemap'}">
        <span aria-hidden="true">🗂</span><span class="text-label-xs">전체</span></a>
    <a class="l6-tab" th:href="${site != null ? '/login?siteCode=' + site.siteCode : '/login'}">
        <span aria-hidden="true">👤</span><span class="text-label-xs">MY</span></a>
</nav>

<!-- 전체 메뉴 시트 — 탭 5칸에 담기지 않는 나머지 메뉴의 출구 -->
<dialog id="l6-menu" class="l6-sheet">
    <div class="l6-sheet-head">
        <b class="text-label-lg">전체 메뉴</b>
        <span class="grow"></span>
        <button type="button" class="krds-btn krds-btn-text krds-btn-sm"
                data-action="close-dialog" aria-label="닫기">✕</button>
    </div>
    <nav class="l6-sheet-body" aria-label="전체 메뉴" th:if="${menuTree != null}">
        <details th:each="m1 : ${menuTree}"
                 th:attr="open=${breadcrumb != null and breadcrumb.contains(m1)} ? open : null">
            <summary class="text-label-md" th:text="${m1.name}">1뎁스</summary>
            <a th:each="m2 : ${m1.children}" class="text-body-sm"
               th:href="${m2.href != null ? m2.href : '#'}" th:text="${m2.name}">2뎁스</a>
        </details>
    </nav>
</dialog>

<script src="/js/vendor/htmx.min.js"></script>
<script src="/js/app.js"></script>
<th:block layout:fragment="scripts"/>

</body>
</html>
