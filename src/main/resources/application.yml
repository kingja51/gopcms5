# =============================================================================
# gopcms5 — 기본 설정
# 이 파일의 주석은 운영 정책 문서다 — 설정 변경 전 해당 키 주석 확인, 변경 시 주석 갱신 (CLAUDE.md).
# 비밀값 키 목록: .env.example — password 류는 기본값 없음 = 미주입 시 부팅 실패(fail-fast, 의도된 동작).
# =============================================================================
spring:
  application:
    name: gopcms5
  profiles:
    # 프로파일 미지정 실행 = local (1인 개발 편의). 운영은 --spring.profiles.active=prod 명시.
    default: local
  threads:
    virtual:
      # Java 21 Loom 가상 스레드 — 요청당 1스레드. DevTools 금지 사유(HikariCP race)와 연관.
      enabled: true
  flyway:
    # 3-DB 분리라 Boot 단일 Flyway 자동구성 사용 불가 — FlywayConfig 가 DB 별 3개 빈 직접 구성.
    enabled: false
  thymeleaf:
    # 운영 기본 캐시 on — local 프로파일에서 false 오버라이드.
    cache: true
    servlet:
      # 전체 버퍼링 후 응답 — 부분 출력 중 지연 CSRF 토큰의 세션 생성이
      # "response committed" 로 실패하는 문제 차단 (P6-1 실측: 사이트 레이아웃을
      # decorate 한 큰 로그인 페이지에서 발생. 페이지 규모상 버퍼링 비용 미미)
      produce-partial-output-while-processing: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # 엔진(gopcms.file.upload.max-file-size)과 반드시 같은 값을 본다.
      # 기본값은 1MB 라 그대로 두면 큰 첨부가 컨테이너 단계에서 잘린다.
      # 여기서 먼저 끊는 것이 이득이다 — 디스크에 다 받은 뒤 거부하면 그만큼 자원을 쓴다.
      max-file-size: 200MB
      max-request-size: 210MB
      file-size-threshold: 1MB

# ── 3-DB 접속 (conventions.md §3) ────────────────────────────────────────────
# primary=GOPCMS 기본(tb_*) / secondary=클라이언트(tn_*) / logging=로그·통계(log_*/stat_*).
# URL·계정은 환경변수 주입(.env.example 키와 1:1). driver 만 MariaDB 기본값 허용.
gopcms:
  datasource:
    # 매퍼 XML 벤더 접미어 — 파일명 *Mapper_{vendor}.xml 과 1:1 (conventions §4.4).
    # 이 값이 고른 한 벌만 로드한다. 두 벌(_maria + _postgres)을 함께 읽으면
    # 같은 namespace 가 중복 등록돼 기동이 깨지므로, 벤더 전환은 이 키 하나로 한다.
    vendor: maria
    primary:
      url: ${GOPCMS_DB_PRIMARY_URL}
      username: ${GOPCMS_DB_PRIMARY_USER}
      password: ${GOPCMS_DB_PRIMARY_PASSWORD}
      driver-class-name: ${GOPCMS_DB_PRIMARY_DRIVER:org.mariadb.jdbc.Driver}
      hikari:
        pool-name: gopcms-primary
        maximum-pool-size: 10
    secondary:
      url: ${GOPCMS_DB_SECONDARY_URL}
      username: ${GOPCMS_DB_SECONDARY_USER}
      password: ${GOPCMS_DB_SECONDARY_PASSWORD}
      driver-class-name: ${GOPCMS_DB_SECONDARY_DRIVER:org.mariadb.jdbc.Driver}
      hikari:
        pool-name: gopcms-secondary
        maximum-pool-size: 5
    logging:
      url: ${GOPCMS_DB_LOGGING_URL}
      username: ${GOPCMS_DB_LOGGING_USER}
      password: ${GOPCMS_DB_LOGGING_PASSWORD}
      driver-class-name: ${GOPCMS_DB_LOGGING_DRIVER:org.mariadb.jdbc.Driver}
      hikari:
        pool-name: gopcms-logging
        maximum-pool-size: 5
  flyway:
    # dev 시드(db/devdata/*, V900+ 대역) 포함 여부 — local/dev 프로파일만 true.
    # ※ P6-2 인가 규칙(V909)이 dev 시드에 있다 — false 로 기동하면 규칙 0건이라
    #   RbacSmokeRunner 가 기동을 중단시킨다(전면 차단 상태로 뜨는 것을 막는 의도된 동작).
    devdata: false

  # ── 위지윅 에디터 (P9-2b) ──────────────────────────────────────────────────
  # tiptap | namo | ckeditor5 — 교체해도 저장·정화·업로드·권한은 한 벌 그대로다.
  # provider 별로 갈리는 것은 셋뿐: 자산 목록·프래그먼트 이름·어댑터 JS.
  #   tiptap    = 기본. 번들은 `npm run editor` 로 생성한다(self-host, CDN 금지)
  #   namo      = Namo CrossEditor 4(상용). 벤더 번들을 static/js/vendor/crosseditor/ 에 배치.
  #               라이선스 때문에 번들을 저장소에 커밋하지 않는다
  #   ckeditor5 = GPL 로고 또는 상용 라이선스 키 필요 — 도입 전 확인
  # 선택한 provider 의 자산이 없으면 EditorAssetSmokeRunner 가 기동을 멈춘다
  # (폼을 열고 나서야 "에디터가 안 뜬다" 를 알게 되면 늦다).
  editor:
    provider: tiptap

  # ── 메일 발송 ──────────────────────────────────────────────────────────────
  # enabled=false 가 기본이다 — SMTP 계정 없이도 기동하고, 개발 중 실메일이 나가는
  # 사고를 막는다. 꺼져 있으면 발송 대신 로그에 남긴다(본문은 남기지 않는다).
  # 운영에서 켤 때는 spring.mail.* (host/port/username/password) 를 함께 설정한다.
  mail:
    enabled: false
    from: no-reply@gopcms.local
    from-name: GOPCMS

  # ── 본인인증 (NICE CheckPlus) ──────────────────────────────────────────────
  # 콜백 URL 은 NICE 콘솔에 등록한 문자열과 한 글자도 다르면 안 된다 — 그래서
  # 사이트별 경로(/{siteCode}/...)가 아니라 사이트 무관 고정 경로다.
  # 자격(site-code/site-password)이 비면 기동은 되고 인증 화면만 안내를 띄운다:
  # 계약 전에도 나머지 기능이 떠야 하기 때문이다.
  nice:
    enabled: ${GOPCMS_NICE_ENABLED:true}
    site-code: ${GOPCMS_NICE_SITE_CODE:}
    site-password: ${GOPCMS_NICE_SITE_PASSWORD:}
    return-url: ${GOPCMS_NICE_RETURN_URL:http://127.0.0.1:8080/member/identity/nice/success}
    error-url: ${GOPCMS_NICE_ERROR_URL:http://127.0.0.1:8080/member/identity/nice/fail}
    auth-type: ""      # 빈 값 = 사용자가 인증 수단을 고르는 기본 화면
    customize: ""      # 빈 값 = PC, "Mobile" = 모바일 전용 화면

  # ── 소셜 로그인 (OAuth2) ───────────────────────────────────────────────────
  # spring-security-oauth2-client 를 쓰지 않고 RestClient 로 직접 처리한다.
  # 인가가 DB 단일 원천(tb_role_url_access)이라, 자체 필터 체인을 끼워 넣는
  # 스타터보다 authorization_code 교환만 하는 편이 경계가 분명하다.
  # client-id 가 비면 그 provider 버튼은 로그인 화면에 아예 나오지 않는다.
  oauth2:
    enabled: ${GOPCMS_OAUTH2_ENABLED:true}
    redirect-base-url: ${GOPCMS_OAUTH2_REDIRECT_BASE_URL:}
    naver:
      client-id: ${GOPCMS_OAUTH2_NAVER_CLIENT_ID:}
      client-secret: ${GOPCMS_OAUTH2_NAVER_CLIENT_SECRET:}
      callback-url: ${GOPCMS_OAUTH2_NAVER_CALLBACK_URL:}
    kakao:
      client-id: ${GOPCMS_OAUTH2_KAKAO_CLIENT_ID:}
      client-secret: ${GOPCMS_OAUTH2_KAKAO_CLIENT_SECRET:}
      callback-url: ${GOPCMS_OAUTH2_KAKAO_CALLBACK_URL:}
    google:
      client-id: ${GOPCMS_OAUTH2_GOOGLE_CLIENT_ID:}
      client-secret: ${GOPCMS_OAUTH2_GOOGLE_CLIENT_SECRET:}
      callback-url: ${GOPCMS_OAUTH2_GOOGLE_CALLBACK_URL:}

  member:
    consent-version: "1.0"
    # 탈퇴 회원의 게시글 작성자 표기 — 화면에 그대로 노출되는 문구다.
    # 글은 지우지 않는다: 대화의 맥락이 통째로 사라지면 남은 사람들의 글이 읽히지 않는다.
    # 지워야 하는 것은 "누가 썼는지" 이지 "무엇을 썼는지" 가 아니다.
    anonymous-writer-name: 탈퇴한 회원
    # ── 이메일 인증번호 (P10-5 휴면 복원) ────────────────────────────────────
    # 관리자 2FA(TOTP)와 다른 것 — 서버가 만들어 메일로 보내고 한 번 쓰면 끝난다.
    # 코드는 평문으로 저장하지 않고(HMAC 해시), 시도 횟수는 세션이 아니라 행에 둔다
    # (세션에 두면 세션을 새로 잡아 무제한 대입할 수 있다).
    otp:
      ttl-minutes: 5
      max-attempts: 5
      resend-cooldown-seconds: 60
      # 발송 제한은 두 축이다. 쿨다운(위)은 "한 계정에 연달아" 를 막고, 아래는
      # "한 IP 가 계정을 바꿔 가며" 를 막는다 — 쿨다운만으로는 아이디만 바꾸면
      # 한 번도 걸리지 않으면서 대량 발송이 가능하다.
      rate:
        per-ip: 10
        window-minutes: 60
    # ── 회원 생명주기 (P10-4) ────────────────────────────────────────────────
    # ACTIVE ─[미접속 1년]→ 휴면 ─[+1년]→ 탈퇴(PII 파기) ─[+1년]→ 완전 삭제
    #
    # dry-run 이 기본이다. 스케줄은 돌지만 대상만 로그에 남는다 — 배치를 처음 켜는 순간
    # 오래된 계정이 한꺼번에 사라지는 것이 가장 흔한 사고다. 운영자가 로그로 대상을
    # 확인하고 명시적으로 false 로 바꿔야 실제 처리가 시작된다.
    # batch-size 는 1회 상한 — 되돌릴 수 없는 배치에는 상한이 있어야 잘못 돌아도
    # 피해가 한 배치로 제한된다.
    lifecycle:
      dry-run: true
      batch-size: 200
      dormant-days: 365
      withdraw-days: 365
      notice-cron: "0 10 3 * * *"    # 안내가 전환보다 먼저 돌아야 한다
      dormant-cron: "0 30 3 * * *"
      withdraw-cron: "0 40 3 * * *"
      purge-cron: "0 50 3 * * *"

  # ── 보존기간 (P10-7) ───────────────────────────────────────────────────────
  # 회원 PII 는 탈퇴 시 즉시 파기하고, 이력·원장만 기간을 둔다.
  # 값을 여기 모으는 이유: 코드 상수로 흩어지면 정책이 바뀔 때 반드시 하나를 빠뜨리고,
  # 빠뜨린 쪽은 조용히 옛 기간으로 계속 돈다.
  #   · 통계 stat_* 에 대응하는 키가 없는 것은 누락이 아니다 — 영구 보존이라
  #     기간이라는 개념이 없고, 값을 두면 언젠가 누군가 파기 기준으로 쓴다.
  retention:
    withdraw-months: 36          # 탈퇴 원장 tb_member_withdraw
    privacy-log-months: 60       # 개인정보 접근·파기 이력 — 5년(다른 로그보다 길다)
    log-months: 36               # 나머지 log_*
    login-history-months: 36     # tb_login_history — 성격은 로그지만 primary_db 에 있다
    legal-basis: 개인정보보호법 제21조(개인정보의 파기)
    # 되돌릴 수 없는 배치의 기본값은 전부 "아무것도 지우지 않는" 쪽이다.
    purge:
      enabled: true
      dry-run: true              # 켜는 순간 몇 년치가 한꺼번에 사라지는 사고를 막는다
      batch-size: 1000           # 테이블 1개당 1회 상한 — 남으면 다음 회차가 이어받는다
      cron: "0 20 4 * * *"       # 파일 정리(4시)·회원 생명주기(3시)와 겹치지 않게

  # ── 파일 업로드 ────────────────────────────────────────────────────────────
  # 저장 경로는 반드시 웹루트 밖. 정적 자원 경로 안에 두면 톰캣이 파일을 그대로
  # 내보내므로, 올라온 스크립트가 곧바로 실행 가능한 URL 을 갖게 된다(웹쉘의 고전 경로).
  # 다운로드는 예외 없이 /file/** 컨트롤러를 지나며 권한·검사상태 판정을 받는다.
  file:
    max-files-per-group: 20      # 한 폼당 첨부 상한 — 화면과 서버가 같은 값을 본다
    thumbnail-size: 400
    # 정리 배치 — 되돌릴 수 없는 작업이라 기본이 dry-run 이다.
    # 스케줄은 돌지만 대상만 로그에 남고 실제로는 지우지 않는다. 운영자가 로그로 대상을
    # 확인한 뒤 dry-run 을 false 로 바꿔야 삭제가 시작된다. 배치를 처음 켜는 순간
    # 오래된 파일이 한꺼번에 사라지는 사고가 가장 흔해서 이렇게 둔다.
    purge:
      cron: "0 0 4 * * *"
      dry-run: true
      retention-days: 180        # soft delete 후 물리 삭제까지의 유예
      orphan-group-days: 7       # 저장하지 않고 나간 폼이 남긴 빈 묶음 회수 유예
      batch-size: 500            # 1회 상한 — 잘못 돌아도 피해가 한 배치로 제한된다
    # 백신 재검사 — clamav.enabled=true 일 때만 잡이 만들어진다.
    rescan:
      cron: "0 */10 * * * *"
      stale-minutes: 30
      batch-size: 200
    # 문서 미리보기 — 형식마다 "어디서 파싱하느냐" 가 다르다.
    #  · 이미지·PDF : 브라우저가 연다 (서버는 바이트를 흘릴 뿐)
    #  · HWP/HWPX  : rhwp(WASM)가 브라우저 샌드박스 안에서 연다
    #  · 오피스     : 유일하게 서버가 연다 → 그래서 기본 꺼짐 + 별도 프로세스·타임아웃 격리
    # LibreOffice 를 켤 때는 OS 레벨에서 전용 계정·네트워크 차단을 함께 걸어야 한다.
    # 앱이 대신해 줄 수 없는 부분이다.
    viewer:
      office:
        enabled: ${GOPCMS_VIEWER_OFFICE_ENABLED:false}
        binary: ${GOPCMS_SOFFICE_BIN:soffice}
        timeout-seconds: 60
        cache-dir: ${GOPCMS_VIEWER_CACHE_DIR:./data/gopcms/preview}
    clamav:
      # false = NoOpVirusScanQueue. 신규 파일은 PENDING 으로 남으며,
      # PENDING 다운로드 허용은 앞의 다중 방어를 통과했다는 전제 위의 운영 판단이다.
      enabled: false
    upload:
      base-dir: ${GOPCMS_FILE_BASE_DIR:./data/gopcms/files}
      quarantine-dir: ${GOPCMS_FILE_QUARANTINE_DIR:./data/gopcms/quarantine}
      thumb-dir: ${GOPCMS_FILE_THUMB_DIR:./data/gopcms/thumbs}
      max-file-size: 200MB
      # 화이트리스트만 쓴다 — 블랙리스트는 새 확장자가 나올 때마다 뚫린다.
      allowed-extensions:
        any: [pdf, doc, docx, xls, xlsx, ppt, pptx, hwp, hwpx, txt, csv,
              jpg, jpeg, png, gif, webp, bmp, zip, mp4, mov, webm]
        document: [pdf, doc, docx, xls, xlsx, ppt, pptx, hwp, hwpx, txt, csv]
        image: [jpg, jpeg, png, gif, webp, bmp]
        video: [mp4, mov, webm]

  security:
    # 신뢰 프록시 CIDR CSV — 비우면 X-Forwarded-For 를 아예 무시한다(위조 가능 헤더).
    # 리버스 프록시(Nginx/L4) 뒤에 둘 때만 그 대역을 넣는다. 예: 10.0.0.0/8,192.168.0.0/16
    trusted-proxies: ${GOPCMS_TRUSTED_PROXIES:}
    # CSP 를 위반 관찰 전용으로 돌릴 때 true — 신규 화면 도입기에만 임시 사용.
    csp-report-only: false
    # form-action 에 덧붙일 외부 출처(공백 구분). 본인인증 팝업이 NICE 도메인으로
    # 폼을 POST 하므로 필요하다 — 비우면 전송이 조용히 차단된다(콘솔에만 위반이 뜬다).
    csp-form-action-extra: https://nice.checkplus.co.kr
  batch:
    # 역할 계층 closure + 사용자 role_ids/role_codes 스냅샷 재계산 (RoleHierarchyRebuildJob).
    # 정상 경로는 역할·계층을 바꾼 트랜잭션이 RoleService.rebuildHierarchy() 를 직접 호출하는 것.
    # 이 스케줄은 그 경로를 우회한 변경(콘솔 수기 수정 등)을 바로잡는 안전망이라 기본 비활성('-').
    # 다중 인스턴스에서 켜려면 ShedLock(logging_db.shedlock) 적용이 선행돼야 한다.
    role-rebuild-cron: '-'

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      # 쿠키명은 SecurityConfig.SESSION_COOKIE 상수와 반드시 일치(로그아웃 시 삭제 대상).
      # 기본 JSESSIONID 를 쓰지 않는 것은 서버 스택 노출을 줄이려는 의도.
      # secure 는 HTTPS 종단에서만 켠다 — prod 프로파일에서 true 로 오버라이드.
      cookie:
        name: GOPCMS_SID
        http-only: true
        same-site: lax
        secure: false
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        # P6(Security) 전 최소 노출 — prometheus 등 확장은 P6 이후 보호 하에 개방.
        include: health,info
